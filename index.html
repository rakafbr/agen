<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kalkulator Pesanan — Agen Alamanda</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1>🛒 Agen Alamanda</h1>
    </div>
    <p class="subtitle">Kalkulasi pesanan sat set tanpa pusing 🤯</p>
  </header>

  <main class="main">
    <section id="menu-pesanan" class="menu active" aria-labelledby="title-pesanan">
      <h2 id="title-pesanan" class="section-title">Kalkulator Pesanan</h2>

      <div id="items-grid" class="grid" aria-live="polite"></div>

      <footer class="sticky-footer" id="footer-pesanan" aria-live="polite">
        <div class="footer-left">
          <div class="label">Total Bayar</div>
          <div id="total-bayar" class="total-amount">Rp 0</div>
        </div>
        <div class="footer-right">
          <button id="btn-hitung-struk" class="btn primary" type="button" aria-label="Tampilkan struk" disabled>
            Hitung Sekarang
          </button>
        </div>
      </footer>
    </section>
  </main>

  <div id="overlay" class="overlay" style="display:none;">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-header">
        <h3 id="modal-title">Struk Pesanan</h3>
        <button id="close-modal" class="icon-btn" type="button" aria-label="Tutup struk">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#333" d="M18.3 5.71L12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.3 19.71 2.89 18.3 9.18 12 2.89 5.71 4.3 4.29 10.59 10.6 16.88 4.29z"/>
          </svg>
        </button>
      </header>

      <div class="modal-body">
        <div id="receipt-list"></div>
        <div class="receipt-total">
          <strong>Total Bayar</strong>
          <strong id="receipt-total">Rp 0</strong>
        </div>
      </div>

      <footer class="modal-footer">
        <button id="reset-order" class="btn ghost" type="button" aria-label="Reset pesanan">Bersihkan</button>
        <button id="btn-screenshot" class="btn primary" type="button">📸 Screenshot</button>
      </footer>
    </div>
  </div>
</div>

  <script src="app.js" defer></script>
</body>
</html>
